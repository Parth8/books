<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- Shelfie's Worker (worker/worker.js). It holds the Google Books key; this page never does.
       If you rename the Worker, change it here AND in connect-src below. -->
  <meta name="api-base" content="https://shelf-api.8parthaggarwal1999.workers.dev">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://books.google.com https://books.googleusercontent.com https://covers.openlibrary.org https://archive.org https://*.archive.org; font-src 'self'; connect-src 'self' https://shelf-api.8parthaggarwal1999.workers.dev https://openlibrary.org; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">

  <title>Shelfie: read, swipe, level up</title>
  <meta name="description" content="A gesture-first reading tracker. Swipe your books, drag to turn pages, spin the dial, level up. No account, no ads.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Shelfie">
  <meta property="og:title" content="Shelfie: read, swipe, level up">
  <meta property="og:description" content="A gesture-first reading tracker. Swipe your books, drag to turn pages, spin the dial, level up.">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Shelfie">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/archivo-100-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/spacemono-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-shelf="reading">
  <div class="grain" aria-hidden="true"></div>

  <main id="app">
    <header class="hud">
      <div class="hud-row">
      <button type="button" class="lcd" id="lcd" aria-label="Your stats">
        <i class="led" aria-hidden="true"></i>
        <span class="lcd-text" id="lcd-text">LV01 · 0 XP</span>
        <span class="lcd-xp" aria-hidden="true"><i id="lcd-xp"></i></span>
        <span class="lcd-streak" id="lcd-streak">🔥0</span>
      </button>
      <button type="button" class="me-btn" id="me" aria-label="You: account, backup and settings" aria-controls="panel-me"><span id="me-face">👤</span></button>
      </div>
      <div class="tape" id="tape">
        <div class="tape-track" id="tape-track" role="tablist" aria-label="Shelves"></div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Books on this shelf">
      <div class="stage-bg" aria-hidden="true"><span class="stage-word" id="stage-word">READING</span></div>
      <div class="zones" id="zones" aria-hidden="true">
        <div class="zone z-left" data-zone="want"><b>WANT</b><small>DROP HERE</small></div>
        <div class="zone z-right" data-zone="reading"><b>READING</b><small>DROP HERE</small></div>
        <div class="zone z-top" data-zone="read"><b>FINISHED ✓</b></div>
        <div class="zone z-bottom" data-zone="bin"><b>REMOVE ✕</b></div>
      </div>
      <div class="deck" id="deck" tabindex="0" aria-roledescription="pile of books"></div>
      <div class="hint-slot" id="hint-slot"></div>
      <span class="counter" id="counter" aria-live="polite"></span>
    </section>

    <section class="dock" id="dock" aria-label="Controls"></section>

    <button type="button" class="pullbar" id="pullbar" aria-label="Your stats" aria-controls="panel-stats"><i aria-hidden="true"></i><span>STATS</span></button>
  </main>

  <section class="panel" id="panel-stats" role="dialog" aria-modal="true" aria-labelledby="stats-title" aria-hidden="true">
    <div class="panel-grab"><i class="grab" aria-hidden="true"></i><h2 id="stats-title">STATS</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
    <div class="panel-body" id="stats-body"></div>
  </section>

  <section class="panel" id="panel-me" role="dialog" aria-modal="true" aria-labelledby="me-title" aria-hidden="true">
    <div class="panel-grab"><i class="grab" aria-hidden="true"></i><h2 id="me-title">YOU</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
    <div class="panel-body" id="me-body"></div>
  </section>

  <section class="panel" id="panel-import" role="dialog" aria-modal="true" aria-labelledby="import-title" aria-hidden="true">
    <div class="panel-grab"><i class="grab" aria-hidden="true"></i><h2 id="import-title">GOODREADS</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
    <div class="panel-body" id="import-body"></div>
  </section>

  <section class="panel" id="panel-add" role="dialog" aria-modal="true" aria-labelledby="add-title" aria-hidden="true">
    <div class="panel-grab"><i class="grab" aria-hidden="true"></i><h2 id="add-title">ADD A BOOK</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
    <div class="panel-body">
      <label class="lcd-input">
        <span aria-hidden="true">&gt;</span>
        <input id="q" type="search" placeholder="TITLE, AUTHOR, ISBN" autocomplete="off" enterkeyhint="search" aria-label="Search books" spellcheck="false">
      </label>
      <p class="legend" id="legend" aria-hidden="true"></p>
      <div class="results" id="results" aria-live="polite"></div>
      <p class="source" id="source"></p>
      <details class="manual">
        <summary>CAN'T FIND IT? TYPE IT IN</summary>
        <div class="manual-form">
          <label>TITLE<input id="m-title" type="text" maxlength="140" autocomplete="off"></label>
          <label>AUTHOR<input id="m-author" type="text" maxlength="100" autocomplete="off"></label>
          <label>PAGES<input id="m-pages" type="number" min="1" max="5000" inputmode="numeric" value="300"></label>
          <button type="button" class="key k-blue" id="m-add"><span>ADD TO WANT</span></button>
        </div>
      </details>
    </div>
  </section>
</body>
</html>
